name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Build extension
        run: |
          phpize
          ./configure --enable-blake3
          make -j"$(nproc)"
      - name: Run PHPT suite
        run: make test TESTS="tests/*.phpt" NO_INTERACTION=1 REPORT_EXIT_STATUS=1
      - name: Check PHP polyfill vectors
        run: php tests/polyfill.php
